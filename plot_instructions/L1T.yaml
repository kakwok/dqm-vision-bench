version: '1.0'
subsystem: L1T
plots:
  L1T_00_CaloLayer1ECALoccupancy:
    plot_number: '00'
    folder: L1T_00_CaloLayer1ECALoccupancy
    title: CaloLayer1 ECAL occupancy
    instruction: |-
      Description: This plot counts the number of ECAL trigger towers, weighted by the tower energy, for all events seen by the L1T DQM system in integer eta-phi space. Quality criteria for collisions: The plot should be completely filled without big white areas. Any white area larger than two neighboring pixels must be reported. Quality criteria for cosmics: When not taking collision data, large white areas might appear simply because the corresponding calorimeter sections are not included in the run. You can check with DAQ shifter to see if that is the case. In non-collision runs, the occupancy is dominated by noise and more variance is normal and not a concern. Known issues: Small white areas of 1-2 pixels are expected due to masked noisy ECAL towers. Action for online DQM shifter: If the quality criteria are not met, call L1 DOC and make an entry in the Event Display and DQM Elog. Then post a link to your DQM Elog entry into the Trigger Elog. Action for offline trigger shifter: If the quality criteria are not met, mark the run as BAD, submit a JIRA ticket and mention this in your Elog shift summary.
    known_issues: []
    last_updated: '2026-07-28'
    updated_by: html_parser
  L1T_01_CaloLayer1HCALoccupancy:
    plot_number: '01'
    folder: L1T_01_CaloLayer1HCALoccupancy
    title: CaloLayer1 HCAL occupancy
    instruction: |-
      Description: This plot counts the number of HCAL trigger towers, weighted by the tower energy, for all events seen by the L1T DQM system in integer eta-phi space. Quality criteria for collisions: The plot should be completely filled without big white areas. Any larger area than a single white pixel must be reported. Quality criteria for cosmics: If not taking collision data, large white areas might appear simply because the corresponding calorimeter sections are not included in the run. You can check with DAQ shifter to see if that is the case. In non-collision runs, the occupancy is dominated by noise and more variance is normal and not a concern. The endcap (abs. iEta>17) regions can show very little occupancy, this is due to lower electronic noise and not a problem. Known issues: Empty channel at iPhi=51, iEta=+9 to +12, as reported in slide 4 of ppt. Expected to resolve the issue in Decempber 2022. Action for online DQM shifter: If you spot white areas in this plot, call L1 DOC and make an entry in the Event Display and DQM Elog. Then post a link to your DQM Elog entry into the Trigger Elog. Action for offline trigger shifter: If the quality criteria are not met, mark the run as BAD, submit a JIRA ticket and mention this in your Elog shift summary.
    known_issues: []
    last_updated: '2026-07-28'
    updated_by: html_parser
  L1T_02_CaloLayer2centraljetETetaphi:
    plot_number: '02'
    folder: L1T_02_CaloLayer2centraljetETetaphi
    title: CaloLayer2 central jet E_T eta phi
    instruction: |-
      Description: CaloLayer2 central jet transverse energy shown in (eta,phi) plane. Quality criteria for collisions: The shifter should be checking for gross asymmetries between the positive and negative eta halves of the detector. The shifter should also look for obvious holes (masked or dead towers) and hot towers. This should probably be linked to the shifter histograms for Layer 1 which show masked towers. Quality criteria for cosmics: During cosmics, low occupancy in the calorimeter is expected. In non-collision runs, the occupancy is dominated by noise and more variance is normal and not a concern. The endcap (abs. iEta>17) regions can show very little occupancy, this is due to lower electronic noise and not a problem. Action for online DQM shifter: If the quality criteria are not met, call L1 DOC and make an entry in the Event Display and DQM Elog. Then post a link to your DQM Elog entry into the Trigger Elog. Action for offline trigger shifter: If the quality criteria are not met, mark the run as BAD, submit a JIRA ticket and mention this in your Elog shift summary.
    known_issues: []
    last_updated: '2026-07-28'
    updated_by: html_parser
