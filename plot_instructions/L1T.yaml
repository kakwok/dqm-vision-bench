  L1T_08_uGMTmuonpT:
    plot_number: 08
    folder: L1T_08_uGMTmuonpT
    title: uGMT muon p_T
    instruction: |-
      Description: uGMT muon transverse momentum distribution. Quality criteria: Smoothly falling spectrum (spikes at 124 GeV and 200 GeV are expected from the saturation value of track finder pT). Action for online DQM shifter: If the quality criteria are not met, call L1 DOC and make an entry in the Event Display and DQM Elog. Then post a link to your DQM Elog entry into the Trigger Elog. Action for offline trigger shifter: If the quality criteria are not met, mark the run as BAD, submit a JIRA ticket and mention this in your Elog shift summary.
